<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle ESP32-C3 IoT</title>
  <!-- Versão estável do cliente MQTT via WebSockets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f111a;
      color: #e6e6ef;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1a1d2e;
      border: 1px solid #2b304c;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .subtitle { color: #7b849b; font-size: 13px; margin-bottom: 24px; }
    .status-container {
      background-color: #131522;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .status-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #7b849b; margin-bottom: 6px; }
    .status-value { font-size: 24px; font-weight: 700; }
    .ligado { color: #00e676; }
    .desligado { color: #ff5252; }
    .btn {
      width: 100%;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
      background-color: #3b82f6;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { background-color: #374151; cursor: not-allowed; box-shadow: none; }
    .info { margin-top: 20px; font-size: 12px; color: #7b849b; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Controle de LED</h1>
    <p class="subtitle">ESP32-C3 Super Mini</p>

    <div class="status-container">
      <div class="status-label">Status da Placa</div>
      <div id="led-status" class="status-value desligado">DESLIGADO</div>
    </div>

    <button id="toggle-btn" class="btn" onclick="alternarLed()" disabled>Conectando ao Broker...</button>

    <div id="conn-info" class="info">Iniciando conexão segura...</div>
  </div>

  <script>
    // Mesmos tópicos do firmware C++
    const TOPICO_CMD  = "c3supermini/edu/led/set";
    const TOPICO_STAT = "c3supermini/edu/led/status";

    let estadoAtual = "0";

    const statusEl = document.getElementById("led-status");
    const btnEl    = document.getElementById("toggle-btn");
    const infoEl   = document.getElementById("conn-info");

    // Conexão via Paho MQTT (WebSockets Seguro WSS na porta 8884)
    const clientId = "WebClient-" + Math.floor(Math.random() * 100000);
    const client   = new Paho.MQTT.Client("broker.hivemq.com", 8884, "/mqtt", clientId);

    client.onConnectionLost = (response) => {
      infoEl.textContent = "Conexão perdida. Tentando reconectar...";
      btnEl.disabled = true;
      setTimeout(conectar, 3000);
    };

    client.onMessageArrived = (message) => {
      if (message.destinationName === TOPICO_STAT) {
        estadoAtual = message.payloadString;
        if (estadoAtual === "1") {
          statusEl.textContent = "LIGADO";
          statusEl.className = "status-value ligado";
        } else {
          statusEl.textContent = "DESLIGADO";
          statusEl.className = "status-value desligado";
        }
      }
    };

    function conectar() {
      client.connect({
        useSSL: true,
        timeout: 5,
        onSuccess: () => {
          infoEl.textContent = "Nuvem Conectada!";
          btnEl.disabled = false;
          btnEl.textContent = "Alternar LED";
          client.subscribe(TOPICO_STAT);
        },
        onFailure: (err) => {
          infoEl.textContent = "Erro ao conectar no broker. Nova tentativa em 3s...";
          setTimeout(conectar, 3000);
        }
      });
    }

    function alternarLed() {
      const proximoEstado = (estadoAtual === "1") ? "0" : "1";
      const message = new Paho.MQTT.Message(proximoEstado);
      message.destinationName = TOPICO_CMD;
      client.send(message);
    }

    // Inicia a conexão
    conectar();
  </script>

</body>
</html>
